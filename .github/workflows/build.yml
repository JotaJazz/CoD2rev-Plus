name: Build

# Only build when something that affects the binaries changes;
# documentation and script edits do not start a run.
on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "Makefile"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "src/**"
      - "Makefile"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  linux:
    name: Linux (${{ matrix.bits }}-bit), CoD2 ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "1.0"
            protocol: 115
            arch: x64
            bits: 64
            artifact: cod2rev_lnxded-1.0
          - version: "1.3"
            protocol: 118
            arch: x64
            bits: 64
            artifact: cod2rev_lnxded-1.3
          - version: "1.0"
            protocol: 115
            arch: x86
            bits: 32
            artifact: cod2rev_lnxded-1.0-x86
          - version: "1.3"
            protocol: 118
            arch: x86
            bits: 32
            artifact: cod2rev_lnxded-1.3-x86
    steps:
      - uses: actions/checkout@v7
      - name: Install 32-bit toolchain
        if: matrix.arch == 'x86'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib
      - name: Build
        run: |
          make -j"$(nproc)" PROTOCOL=${{ matrix.protocol }} ARCH=${{ matrix.arch }}
      - name: Start the server without game files
        # Exit code 1 with the engine's own error message; a crash at startup
        # or a hang would end differently
        run: |
          mkdir ci-empty
          cd ci-empty
          code=0
          timeout 30 ../bin/cod2rev_lnxded +set fs_basepath . +set dedicated 1 2>err.log >/dev/null || code=$?
          cat err.log
          test "$code" = 1
          grep -q Sys_Error err.log
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: bin/cod2rev_lnxded
          if-no-files-found: error

  mysql:
    # Only checks that the MySQL functions build; the binary needs the
    # client library at run time, so it is not published.
    name: Linux (64-bit) with MySQL, CoD2 1.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the MariaDB client library
        run: |
          sudo apt-get update
          sudo apt-get install -y libmariadb-dev
      - name: Build
        run: |
          make -j"$(nproc)" WITH_MYSQL=true

  windows:
    name: Windows (MinGW cross-build), CoD2 ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "1.0"
            protocol: 115
          - version: "1.3"
            protocol: 118
    steps:
      - uses: actions/checkout@v7
      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686-posix g++-mingw-w64-i686-posix binutils-mingw-w64-i686
      - name: Build
        run: |
          make -j"$(nproc)" PROTOCOL=${{ matrix.protocol }} windows
      - uses: actions/upload-artifact@v7
        with:
          name: cod2rev_win32-${{ matrix.version }}
          path: |
            bin/cod2rev_win32.exe
            scripts/windows/iniciar_cod2rev.bat
          if-no-files-found: error
