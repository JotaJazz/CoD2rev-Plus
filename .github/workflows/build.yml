name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux (32-bit), CoD2 ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "1.0"
            protocol: 115
          - version: "1.3"
            protocol: 118
    steps:
      - uses: actions/checkout@v7
      - name: Install 32-bit toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib
      - name: Build
        run: |
          mkdir -p bin obj
          make -j"$(nproc)" PROTOCOL=${{ matrix.protocol }} bin/cod2rev_lnxded
      - uses: actions/upload-artifact@v7
        with:
          name: cod2rev_lnxded-${{ matrix.version }}
          path: bin/cod2rev_lnxded
          if-no-files-found: error

  windows:
    name: Windows (MinGW cross-build), CoD2 ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "1.0"
            protocol: 115
          - version: "1.3"
            protocol: 118
    steps:
      - uses: actions/checkout@v7
      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686-posix g++-mingw-w64-i686-posix binutils-mingw-w64-i686
      - name: Build
        run: |
          mkdir -p bin obj
          make -j"$(nproc)" PROTOCOL=${{ matrix.protocol }} windows
      - uses: actions/upload-artifact@v7
        with:
          name: cod2rev_win32-${{ matrix.version }}
          path: |
            bin/cod2rev_win32.exe
            scripts/windows/iniciar_cod2rev.bat
          if-no-files-found: error
