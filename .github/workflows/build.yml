name: Build

# Only build when something that affects the binaries changes;
# documentation and script edits do not start a run.
on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "Makefile"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "src/**"
      - "Makefile"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  linux:
    name: Linux (${{ matrix.bits }}-bit), CoD2 ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "1.0"
            protocol: 115
            arch: x86
            bits: 32
            artifact: cod2rev_lnxded-1.0
          - version: "1.3"
            protocol: 118
            arch: x86
            bits: 32
            artifact: cod2rev_lnxded-1.3
          - version: "1.0"
            protocol: 115
            arch: x64
            bits: 64
            artifact: cod2rev_lnxded-1.0-x64
          - version: "1.3"
            protocol: 118
            arch: x64
            bits: 64
            artifact: cod2rev_lnxded-1.3-x64
    steps:
      - uses: actions/checkout@v7
      - name: Install 32-bit toolchain
        if: matrix.arch == 'x86'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib
      - name: Build
        run: |
          make -j"$(nproc)" PROTOCOL=${{ matrix.protocol }} ARCH=${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: bin/cod2rev_lnxded
          if-no-files-found: error

  windows:
    name: Windows (MinGW cross-build), CoD2 ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "1.0"
            protocol: 115
          - version: "1.3"
            protocol: 118
    steps:
      - uses: actions/checkout@v7
      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686-posix g++-mingw-w64-i686-posix binutils-mingw-w64-i686
      - name: Build
        run: |
          make -j"$(nproc)" PROTOCOL=${{ matrix.protocol }} windows
      - uses: actions/upload-artifact@v7
        with:
          name: cod2rev_win32-${{ matrix.version }}
          path: |
            bin/cod2rev_win32.exe
            scripts/windows/iniciar_cod2rev.bat
          if-no-files-found: error
